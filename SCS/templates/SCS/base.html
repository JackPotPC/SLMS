{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Главная{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_styles %}
    {% endblock %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3><img src="/static/menu.png" alt="Image" style="cursor: pointer; width: 60px; height: 60px;"></h3>
            <ul>
                <li><img src="/static/servers.png" alt="Image" style="cursor: pointer; width: 50px; height: 50px;" onclick="loadPage('servers')">
                <br>Серверы
                </li>
                <li><img src="/static/account.png" alt="Image" style="cursor: pointer; width: 50px; height: 50px;" onclick="loadPage('account')">
                <br>Аккаунт
                </li>
                <li><img src="/static/support.png" alt="Image" style="cursor: pointer; width: 50px; height: 50px;" onclick="loadPage('support')">
                <br>Поддержка
                </li>
                <li><img src="/static/logout.png" alt="Image" style="cursor: pointer; width: 50px; height: 50px;" onclick="loadPage('logout')">
                <br>Выход
                </li>
            </ul>
        </div>

        <!-- Контент -->
        <div class="content" id="content">
            {% block content %}
                <p>Выберите раздел в боковом меню.</p>
            {% endblock %}
        </div>
    </div>
    <script>
        function loadPage(page) {
            $.ajax({
                url: '/SCS/' + page + '/',
                type: 'GET',
                success: function (data) {
                    $('#content').html(data);
                },
                error: function () {
                    alert("Ошибка загрузки страницы " + page);
                }
            });
        }
    </script>
{% block extra_scripts %}
<!-- Ваши скрипты будут вставлены сюда -->
{% endblock %}
</body>
</html>
